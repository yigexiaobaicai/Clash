[custom]
; 自定义分类规则：精准提取 ˣ⁰˙⁰¹(0.01)、ˣ⁰˙¹(0.1) 和 ˣ⁰(0) 倍率节点

; 基础分流规则
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎡 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🎡 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎡 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/ChinaCompanyIp.list
ruleset=🎯 国内直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ---------------- 策略组定义 ----------------

; 总控制开关
custom_proxy_group=🎡 节点选择`select`[]⚡ 0.01倍率`[]⚡ 0.1倍率`[]🆓 免费/0倍率`[]🚀 手动选择`[]DIRECT

; --- 自动测速分组 (兼容上标字符与标准字符) ---

; 1. 自动选择 0.01 倍率 (匹配 ˣ⁰˙⁰¹ 或 x0.01 或 0.01)
custom_proxy_group=⚡ 0.01倍率`url-test`(ˣ⁰˙⁰¹|x0\.01|0\.01)`http://www.gstatic.com/generate_204`300,,50

; 2. 自动选择 0.1 倍率 (匹配 ˣ⁰˙¹ 或 x0.1 或 0.1，同时排除 0.01/ˣ⁰˙⁰¹)
custom_proxy_group=⚡ 0.1倍率`url-test`^(?!.*(ˣ⁰˙⁰¹|0\.01)).*(ˣ⁰˙¹|x0\.1|0\.1).*$`http://www.gstatic.com/generate_204`300,,50

; 3. 自动选择 0倍率/免费 (匹配 ˣ⁰ 或 x0，排除带小数点的情况)
custom_proxy_group=🆓 免费/0倍率`url-test`(ˣ⁰(?![˙\.] )|x0(?!\.)|0倍率|免费|Free)`http://www.gstatic.com/generate_204`300,,50

; --- 辅助策略组 ---
; 手动选择所有代理节点
custom_proxy_group=🚀 手动选择`select`[]⚡ 0.01倍率`[]⚡ 0.1倍率`[]🆓 免费/0倍率`.*

; 国内直连与兜底
custom_proxy_group=🎯 国内直连`select`[]DIRECT`[]🎡 节点选择
custom_proxy_group=🐟 漏网之鱼`select`[]🎡 节点选择`[]⚡ 0.01倍率`[]⚡ 0.1倍率`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
